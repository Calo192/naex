<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Päta, Lakeť, Otočka — mock nového režimu NA EX!</title>
<style>
/* Tokeny schémy Krčma (apps/web/src/schemy.css) a stôl (apps/web/src/hra/hra.css). */
:root{
  --pozadie:#14110e;--plocha:#1e1914;--plocha-2:#28211a;--plocha-3:#332a21;--okraj:#3d3229;--okraj-svetly:#57483a;
  --text:#f1e8d8;--tlmeny:#b6a790;--slaby:#8b7d6a;--slaby-text:#9d8f7b;
  --akcent:#e9ad45;--akcent-tmavy:#b9802a;--akcent-svetly:#ffd08a;--na-akcente:#2b1b03;
  --cervena:#d0563f;--cervena-text:#e5735c;--cervena-svetla:#ff9d88;
  --zelena:#7cbf74;--zelena-svetla:#7fe39a;--zelena-ziariva:#7dff9c;
  --info:#8fc3e0;--info-silna:#5aa9d6;--ja:#5cc0cf;--ja-tmava:#1d3b40;--su:#e0805f;--su-tmava:#43261d;
  --pismo:Roboto,"Segoe UI",system-ui,sans-serif;--nadpis:Bitter,Georgia,serif;
  --stol:color-mix(in oklab,var(--zelena-ziariva) 15%,var(--pozadie));
  --stol-okraj:color-mix(in oklab,var(--zelena-ziariva) 68%,var(--pozadie));
  --stol-svetlo:color-mix(in srgb,var(--zelena-svetla) 14%,transparent);
  --f-starsi:#6a6ab8;--f-lok:#6ab86a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--pozadie);color:var(--text);font:15px/1.5 var(--pismo);-webkit-text-size-adjust:100%}
body{padding:0 0 calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--nadpis);margin:0;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer}
.hlava{padding:14px 16px 8px;max-width:1100px;margin:0 auto}
.hlava h1{font-size:1.35rem;color:var(--akcent)}
.hlava p{margin:4px 0 0;color:var(--tlmeny);font-size:.88rem}
.znacka{display:inline-block;padding:1px 8px;border-radius:10px;font:700 .7rem/1.6 var(--pismo);letter-spacing:.06em;text-transform:uppercase;vertical-align:middle}
.z-todo{background:color-mix(in srgb,var(--akcent) 22%,transparent);color:var(--akcent-svetly);border:1px solid var(--akcent-tmavy)}
.z-pom{background:color-mix(in srgb,var(--zelena) 20%,transparent);color:var(--zelena-svetla);border:1px solid color-mix(in srgb,var(--zelena) 60%,transparent)}
.z-sko{background:color-mix(in srgb,var(--cervena) 20%,transparent);color:var(--cervena-svetla);border:1px solid color-mix(in srgb,var(--cervena) 60%,transparent)}
.z-obom{background:color-mix(in srgb,var(--info) 18%,transparent);color:var(--info);border:1px solid color-mix(in srgb,var(--info) 55%,transparent)}
main{max-width:1100px;margin:0 auto;padding:0 10px}
.krok{display:none}.krok.aktivny{display:block;animation:pr .25s ease}
@keyframes pr{from{transform:translateY(6px)}to{transform:none}}
.krok>h2{font-size:1.15rem;margin:6px 4px 10px}
.krok>h2 small{font:500 .78rem var(--pismo);color:var(--slaby-text);margin-left:6px}
/* pilulka na hrane stola */
.pilulka{position:relative;z-index:2;width:fit-content;max-width:calc(100% - 24px);margin:0 auto -14px;padding:5px 16px;border-radius:18px;
  background:var(--plocha);border:2px solid var(--stol-okraj);box-shadow:0 4px 14px rgba(0,0,0,.4);text-align:center;font-size:.86rem;color:var(--tlmeny)}
.pilulka b.n{font:800 .74rem/1.4 var(--pismo);letter-spacing:.12em;text-transform:uppercase;color:var(--zelena-svetla);margin-right:8px}
.stol{border-radius:18px;padding:22px 8px 12px;background:radial-gradient(ellipse at center,var(--stol-svetlo),transparent 70%),var(--stol);
  border:2px solid var(--stol-okraj);box-shadow:inset 0 2px 24px rgba(0,0,0,.45),0 0 26px color-mix(in srgb,var(--stol-okraj) 25%,transparent)}
.stol.koniec{--stol:color-mix(in oklab,var(--akcent) 13%,var(--pozadie));--stol-okraj:var(--akcent);--stol-svetlo:color-mix(in srgb,var(--akcent) 10%,transparent)}
.stol.koniec .pilulka b.n{color:var(--akcent)}
.panel{background:var(--plocha);border:1px solid var(--okraj);border-radius:14px;padding:10px 12px;margin:10px 0}
.panel h3{font-size:.98rem;margin-bottom:6px;color:var(--akcent-svetly)}
.panel ul{margin:4px 0;padding-left:18px}.panel li{margin:3px 0}
.tlmeny{color:var(--tlmeny)}.maly{font-size:.82rem}
.tl{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;border:1px solid var(--okraj-svetly);background:var(--plocha-2);font-size:.86rem}
.tl:hover{border-color:var(--akcent)}
.tl.hl{background:var(--akcent);color:var(--na-akcente);border-color:var(--akcent);font-weight:700}
.rad-tl{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
/* ---- karta (mini líce ako apps/web/src/karta) ---- */
.k{--w:92px;width:var(--w);aspect-ratio:63/88;position:relative;flex:none;background:#fff;border-radius:calc(var(--w)*.05);
  box-shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.35);font-family:var(--pismo);color:#222;user-select:none}
.k .ill{position:absolute;inset:0 0 auto 0;height:62%;background:#2a2420 center/cover;border-radius:calc(var(--w)*.05) calc(var(--w)*.05) 0 0}
.k .pas{position:absolute;left:0;right:0;top:62%;height:12%;background:var(--farba);color:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:calc(var(--w)*.1);white-space:nowrap;overflow:hidden;padding:0 4%}
.k .ef{position:absolute;left:0;right:0;top:74%;bottom:0;padding:2% 6%;display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:calc(var(--w)*.066);line-height:1.15;color:color-mix(in srgb,var(--farba) 70%,#000);overflow:hidden}
.k .s{position:absolute;width:calc(var(--w)*.17);height:calc(var(--w)*.17);padding:calc(var(--w)*.017);border-radius:22%;background:var(--farba);
  box-shadow:0 0 0 1px #fff,1px 2px 0 1px rgba(0,0,0,.45);transition:box-shadow .2s,filter .2s,opacity .2s}
.k .s svg{width:100%;height:100%;display:block;fill:#fff}
.k .s.prazdny{background:#fff;box-shadow:0 0 0 1px color-mix(in srgb,var(--farba) 70%,#fff)}
.k .s.L{left:3%}.k .s.R{right:3%}
.k .s.akt{box-shadow:0 0 0 2px var(--zelena-ziariva),0 0 10px 2px var(--zelena-ziariva)}
.k .s.mrtva{filter:grayscale(1);opacity:.4;box-shadow:0 0 0 1px #888}
.k.rot{transform:rotate(180deg)}
.k.mrtvy .ill,.k.mrtvy .pas{filter:grayscale(1) brightness(.7)}
.k.mrtvy .ef{background:#2b2b2b;color:#ffd98a;font-weight:700;border-radius:0 0 calc(var(--w)*.05) calc(var(--w)*.05)}
.k .stuha{position:absolute;left:-4%;right:-4%;top:30%;transform:rotate(-12deg);background:var(--cervena);color:#fff;text-align:center;
  font:800 calc(var(--w)*.11)/1.5 var(--pismo);letter-spacing:.05em;box-shadow:0 3px 8px rgba(0,0,0,.5);z-index:3}
.k .vlastnik{position:absolute;inset:0;border-radius:inherit;z-index:2;display:grid;place-items:center;font:800 calc(var(--w)*.16) var(--nadpis);
  color:#fff;text-shadow:0 2px 6px #000}
.k .vlastnik.ja{background:color-mix(in srgb,var(--ja) 45%,transparent);outline:3px solid var(--ja)}
.k .vlastnik.su{background:color-mix(in srgb,var(--su) 45%,transparent);outline:3px solid var(--su)}
/* ---- rad starších ---- */
.rad-obal{display:flex;flex-direction:column;align-items:center;margin:6px 0 10px}
.rad-nazov{font:700 .76rem var(--pismo);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.rad-nazov.ja{color:var(--ja)}.rad-nazov.su{color:var(--su)}
.rad{display:flex;justify-content:center;gap:0;--w:min(22vw,112px)}
.rad .slot-st{display:flex;flex-direction:column;align-items:center}
.rad .k{--w:min(22vw,112px)}
.rad-oddelovac{height:2px;margin:8px 10%;background:linear-gradient(90deg,transparent,var(--stol-okraj),transparent);opacity:.6}
.pec{width:calc(min(22vw,112px) - 8px);margin-top:5px;font:600 .7rem/1.1 var(--pismo);color:var(--text);text-align:center}
.pec .bar{display:flex;gap:1px;height:7px;margin-bottom:2px}
.pec .bar i{flex:1;background:var(--plocha-3);border-radius:1px}
.pec .bar i.p{background:var(--zelena)}.pec.stred .bar i.p{background:var(--akcent)}.pec.nizka .bar i.p{background:var(--cervena)}
.pec .bar i.d{background:var(--cervena-svetla);animation:bl 1s infinite alternate}
@keyframes bl{to{opacity:.3}}
.odznaky{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin-top:2px;min-height:14px}
.odz{display:inline-flex;align-items:center;gap:2px;padding:0 4px;border-radius:7px;font:700 .64rem/1.4 var(--pismo)}
.odz svg{width:10px;height:10px;fill:currentColor}
.odz.jed{background:color-mix(in srgb,var(--zelena) 25%,transparent);color:var(--zelena-svetla)}
.odz.stit{background:color-mix(in srgb,var(--info) 22%,transparent);color:var(--info)}
.odz.dmg{background:color-mix(in srgb,var(--cervena) 30%,transparent);color:var(--cervena-svetla)}
.odz.nova{background:color-mix(in srgb,var(--akcent) 25%,transparent);color:var(--akcent-svetly)}
.ovl{display:flex;gap:4px;margin-top:4px}
.ovl button{width:30px;height:28px;border-radius:8px;border:1px solid var(--okraj-svetly);background:var(--plocha-2);font-weight:800}
.ovl button:disabled{opacity:.3}
.ovl .cislo{min-width:22px;text-align:center;font-weight:800;line-height:28px}
/* ---- línia pri lokalite ---- */
.linia{display:flex;justify-content:center;align-items:flex-start;overflow-x:auto;padding:6px 0 4px}
.linia .k{--w:min(17.5vw,104px)}
.linia .lokal{margin:0 2px;outline:2px dashed color-mix(in srgb,var(--f-lok) 70%,#fff);outline-offset:2px}
.kraje{display:flex;justify-content:space-between;font-size:.72rem;color:var(--zelena-svetla);padding:0 6%;opacity:.85}
.popis-linie{text-align:center;font-size:.74rem;color:var(--tlmeny);margin-top:2px}
/* ---- bar zdrojov ---- */
.bar-hraca{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:7px 12px;border-radius:12px;margin:8px 0;font-size:.8rem;background:var(--plocha)}
.bar-hraca.ja{border:1px solid var(--ja);box-shadow:inset 3px 0 0 var(--ja)}
.bar-hraca.su{border:1px solid var(--su);box-shadow:inset 3px 0 0 var(--su)}
.bar-hraca .meno{font-weight:800}.bar-hraca.ja .meno{color:var(--ja)}.bar-hraca.su .meno{color:var(--su)}
.zdroj{display:inline-flex;align-items:center;gap:4px;color:var(--text)}
.zdroj svg{width:15px;height:15px;fill:var(--akcent)}
.zdroj.preskrt{color:var(--slaby);text-decoration:line-through}
/* ---- súčty ---- */
.sucty{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
table.sum{width:100%;border-collapse:collapse;font-size:.8rem}
table.sum th,table.sum td{padding:3px 5px;text-align:center;border-bottom:1px solid var(--okraj)}
table.sum th{color:var(--slaby-text);font-weight:600}
table.sum td:first-child,table.sum th:first-child{text-align:left}
table.sum tr.tuhe td{font-weight:800;color:var(--cervena-svetla)}
table.sum td.spolu{font-weight:800;color:var(--akcent-svetly)}
.ak{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.ak i{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:4px;background:var(--plocha-3)}
.ak i svg{width:13px;height:13px;fill:#fff}
.tok{display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center;font-size:.74rem;margin:2px 0 10px}
.tok span{padding:3px 8px;border-radius:9px;background:var(--plocha-2);border:1px solid var(--okraj)}
.tok span.nove{border-color:var(--akcent);color:var(--akcent-svetly);font-weight:700}
.tok b{color:var(--slaby)}
/* ---- draft ---- */
.had{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin:4px 0 12px}
.had span{min-width:36px;padding:3px 4px;border-radius:8px;text-align:center;font:800 .78rem/1.2 var(--pismo);border:1px solid var(--okraj-svetly);background:var(--plocha-2)}
.had span small{display:block;font:500 .6rem/1.2 var(--pismo);color:var(--tlmeny);max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.had span.A{color:var(--ja)}.had span.B{color:var(--su)}
.had span.teraz{background:var(--akcent);color:var(--na-akcente);border-color:var(--akcent);transform:scale(1.08)}
.had span.teraz small{color:var(--na-akcente)}
.draft{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.dl{display:flex;gap:10px;padding:8px;border-radius:12px;background:var(--plocha);border:1px solid var(--okraj);text-align:left;align-items:flex-start}
.dl:not(:disabled):hover{border-color:var(--akcent)}
.dl:disabled{cursor:default}
.dl .k{--w:min(26vw,96px)}
.dl .txt{flex:1;min-width:0;font-size:.8rem}
.dl .txt b{font-size:.95rem;font-family:var(--nadpis)}
.dl .txt .r{margin:3px 0;color:var(--tlmeny)}
.dl .txt q{font-style:italic;color:var(--text)}
/* ---- bitka ---- */
.pruh-todo{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;margin:6px 0 10px;
  background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--akcent) 16%,var(--plocha)) 0 12px,var(--plocha) 12px 24px);border:1px solid var(--akcent-tmavy);font-size:.84rem}
.pruh-todo b{color:var(--akcent-svetly)}
.kroky-bitky{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px;margin:8px 0}
.kb{padding:8px 10px;border-radius:12px;background:var(--plocha);border:1px solid var(--okraj);font-size:.82rem}
.kb h4{margin:0 0 4px;font:800 .78rem var(--pismo);letter-spacing:.06em;text-transform:uppercase;color:var(--akcent-svetly);display:flex;align-items:center;gap:6px}
.kb h4 svg{width:15px;height:15px;fill:currentColor}
.kb .vys{font-weight:800;color:var(--text)}
.os{display:flex;align-items:flex-end;gap:6px;margin-top:6px}
.os div{flex:1;text-align:center;font-size:.66rem;color:var(--tlmeny)}
.os div i{display:block;margin:0 auto 2px;width:70%;background:var(--zelena);border-radius:3px 3px 0 0}
.rozdel{padding:8px 10px;border-radius:12px;border:2px solid var(--akcent);background:color-mix(in srgb,var(--akcent) 8%,var(--plocha));margin:8px 0;font-size:.86rem}
.rozdel .ost{font-weight:800;color:var(--akcent-svetly)}
.vysl{width:100%;border-collapse:collapse;font-size:.78rem;margin-top:6px}
.vysl th,.vysl td{padding:3px 4px;border-bottom:1px solid var(--okraj);text-align:center}
.vysl td:first-child,.vysl th:first-child{text-align:left}
.vysl td.pad{color:var(--cervena-svetla);font-weight:800}
/* ---- Má dosť ---- */
.madost-velka{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.madost-velka .k{--w:min(40vw,170px)}
.efekt-karta{flex:1;min-width:220px;max-width:460px;padding:12px 14px;border-radius:14px;background:#fffaf0;color:#2a2420;border-top:5px solid var(--f-starsi)}
.efekt-karta .h{font:800 .74rem var(--pismo);letter-spacing:.1em;text-transform:uppercase;color:#8a5a00}
.efekt-karta h3{font-size:1.15rem;margin:2px 0 6px;color:#2a2420}
.efekt-karta q{display:block;font-style:italic;color:#5c5148;margin-bottom:6px}
.zoznam-md{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.md{display:flex;gap:8px;padding:8px;border-radius:12px;background:var(--plocha);border:1px solid var(--okraj);font-size:.8rem}
.md img{width:52px;height:52px;border-radius:8px;object-fit:cover;flex:none}
.md b{font-family:var(--nadpis)}
/* ---- lokality ---- */
.lokality{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:6px 0}
.lok{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;border-radius:14px;border:2px solid transparent;background:color-mix(in srgb,#000 22%,transparent)}
.lok .k{--w:min(26vw,128px)}
.lok.vybrana{border-color:var(--akcent);box-shadow:0 0 18px color-mix(in srgb,var(--akcent) 45%,transparent)}
.uroven{font:800 .74rem var(--pismo);letter-spacing:.08em;color:var(--akcent-svetly);text-transform:uppercase}
.uroven i{display:inline-block;width:9px;height:9px;margin-left:2px;border-radius:2px;background:var(--akcent)}
.lok .info{font-size:.72rem;color:var(--tlmeny);text-align:center;max-width:min(30vw,150px)}
.nastenka{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:.72rem;color:var(--tlmeny);margin-top:6px}
.nastenka span{padding:2px 7px;border-radius:8px;background:var(--plocha-2)}
/* ---- koniec ---- */
.vyhra{text-align:center;margin:6px 0 8px}
.vyhra h3{font-size:1.5rem;color:var(--akcent);letter-spacing:.04em}
.vyhra p{margin:4px 0;color:var(--tlmeny)}
/* ---- texty ---- */
.text{max-width:780px;margin:0 auto}
.text p,.text li{font-size:.94rem}
.otazka{padding:10px 12px;border-radius:12px;background:var(--plocha);border:1px solid var(--okraj);margin:8px 0}
.otazka h3{font-size:.98rem;color:var(--text);margin-bottom:4px}
.otazka h3 span{color:var(--akcent);margin-right:6px}
.otazka .odp{margin-top:5px;padding:5px 9px;border-left:3px solid var(--zelena);background:color-mix(in srgb,var(--zelena) 8%,transparent);font-size:.88rem}
/* ---- navigácia ---- */
nav.krokovanie{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;gap:8px;justify-content:space-between;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--pozadie) 92%,transparent);backdrop-filter:blur(6px);border-top:1px solid var(--okraj)}
nav .bodky{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;flex:1}
nav .bodky button{width:26px;height:26px;border-radius:50%;border:1px solid var(--okraj-svetly);background:var(--plocha-2);font:700 .72rem var(--pismo);padding:0}
nav .bodky button.akt{background:var(--akcent);color:var(--na-akcente);border-color:var(--akcent)}
nav .smer{min-width:84px;justify-content:center}
@media (max-width:480px){nav .smer{min-width:44px;padding:7px 10px}nav .smer .sl{display:none}nav .bodky{gap:3px}nav .bodky button{width:24px;height:24px}}
@media (orientation:landscape) and (max-height:520px){
  .rad,.rad .k{--w:min(11vw,96px)}.pec{width:calc(min(11vw,96px) - 6px)}
  .linia .k{--w:min(11vw,92px)}
  .hlava{padding:8px 16px 4px}.hlava h1{font-size:1.1rem}
  .dl .k{--w:84px}
  .lok .k{--w:min(16vw,110px)}
  .madost-velka .k{--w:130px}
}
@media (min-width:900px){.rad,.rad .k{--w:112px}.pec{width:104px}}
</style>
</head>
<body>
<header class="hlava">
  <h1>Päta, Lakeť, Otočka <span class="znacka z-todo">mock</span></h1>
  <p>Nový herný režim NA EX! (roadmapa #166). Súčasný režim sa volá <b>Kalamita</b>. Nič z toho nie je v hre — je to obraz, či sme Michalovi porozumeli. Čísla pečene a efekty <i>Má dosť</i> sú <b>návrhy</b>.</p>
</header>
<main id="main"></main>
<nav class="krokovanie">
  <button class="tl smer" id="spat">&#8592;<span class="sl"> Späť</span></button>
  <div class="bodky" id="bodky"></div>
  <button class="tl hl smer" id="dalej"><span class="sl">Ďalej </span>&#8594;</button>

  return '<div class="rad-obal"><div class="rad-nazov '+kto+'">'+(o.nazov||(kto==="ja"?"Tvoj rad starších":"Rad starších súpera"))+'</div><div class="rad">'+h+'</div></div>';
}
function linia(){
  const r=pocitajLiniu();
  const h=LINIA.map((x,i)=>karta(x.id,{rot:x.rot,stav:r.stav[i],cl:x.lok?"lokal":"",efekt:x.lok?"úroveň 2":undefined})).join("");
  return '<div class="linia">'+h+'</div><div class="kraje"><span>&#8592; pri výčape (tvoj kraj)</span><span>pri dverách (kraj súpera) &#8594;</span></div>'+
    '<div class="popis-linie">Línia pri lokalite — karty a spoje presne ako v Kalamite; súperove karty ležia nohami hore.</div>';
}
function barHraca(kto){
  const z=kto==="ja"?{cig:4,pol:"2 plné · 0 vypité",dlh:"1 (zadĺženie 1)",cir:0,abs:"0 · Chuť 2",pec:"0 / 3"}:{cig:2,pol:"1 plný · 1 vypitý",dlh:"0",cir:1,abs:"1 · Chuť 4",pec:"0 / 3"};
  const zdr=(ik,t)=>'<span class="zdroj">'+(ik?ikona(ik):"")+t+'</span>';
  return '<div class="bar-hraca '+kto+'"><span class="meno">'+(kto==="ja"?"Ty":"Súper")+'</span>'+
    zdr("Cigareta",z.cig+" cig.")+zdr("Poldeci",z.pol)+zdr("Dlh","Dlhy "+z.dlh)+zdr("PoškodeniePečene","Pečeň v Pitke "+z.pec)+
    '<span class="zdroj">Cirhózy '+z.cir+'</span><span class="zdroj">Absťák '+z.abs+'</span><span class="zdroj preskrt">špaky</span></div>';
}
function sucetTab(lin,radS,kto){
  const riadky=[];const sp=a=>(lin[a]||0)+(radS[a]||0);
  riadky.push('<tr class="tuhe"><td>Tuhé (Rana 1 · Pecka 2 · Petelica 3)</td><td>'+tuhe(lin)+'</td><td>'+tuhe(radS)+'</td><td class="spolu">'+(tuhe(lin)+tuhe(radS))+'</td></tr>');
  for(const a of PORADIE_AKCII){if(!sp(a))continue;riadky.push('<tr><td>'+akCh(a)+'</td><td>'+(lin[a]||0)+'</td><td>'+(radS[a]||0)+'</td><td class="spolu">'+sp(a)+'</td></tr>')}
  return '<div class="panel"><h3 style="color:var(--'+(kto==="ja"?"ja":"su")+')">'+(kto==="ja"?"Ty":"Súper")+' — akcie spolu</h3><table class="sum"><tr><th>Akcia</th><th>Línia</th><th>Rad starších</th><th>Spolu</th></tr>'+riadky.join("")+'</table></div>';
}

// ---------- draft ----------
function naTahu(){return st.picks.length<8?SNAKE[st.picks.length]:null}
function dokonciDraft(){
  for(const id of UKAZKA){if(st.picks.length>=8)break;if(!st.picks.includes(id))st.picks.push(id)}
  if(st.ja.length===4)return;
  st.ja=st.picks.filter((_,i)=>SNAKE[i]==="A");st.su=st.picks.filter((_,i)=>SNAKE[i]==="B");st.povodne=[...st.ja];
  // Stav v kole 4 (ilustrácia): pečeň po predošlých bitkách, na poslednom staršom súpera jed 2 z minulého kola.
  const dmgJa=[2,0,3,1],dmgSu=[5,2,3,0];
  STARSI.forEach(id=>st.max[id]=PECEN[id]);
  st.ja.forEach((id,i)=>st.cur[id]=PECEN[id]-dmgJa[i]);
  st.su.forEach((id,i)=>st.cur[id]=PECEN[id]-dmgSu[i]);
  const posl=st.su[3];st.cur[posl]=1;st.jed={[posl]:2};
}
function krokDraft(){
  const t=naTahu();
  const had=SNAKE.map((s,i)=>'<span class="'+s+(i===st.picks.length?" teraz":"")+'">'+(s==="A"?"Ty":"Súp.")+'<small>'+(st.picks[i]?CARDS[st.picks[i]].name:(i+1)+".")+'</small></span>').join("");
  const tiles=STARSI.map(id=>{
    const ix=st.picks.indexOf(id),own=ix<0?null:(SNAKE[ix]==="A"?"ja":"su"),m=MADOST[id],kt=KTO[m.kto];
    return '<button class="dl" data-pick="'+id+'"'+(own||!t?" disabled":"")+'>'+karta(id,{vlastnik:own})+
      '<div class="txt"><b>'+CARDS[id].name+'</b><div class="r">'+ikonaPecen()+' pečeň <b>'+PECEN[id]+'</b> <span class="znacka z-todo">návrh</span></div>'+
      '<div class="r">6 akcií · vľavo '+(typ(id)==="hore"?"hore":"dole")+', vpravo '+(typ(id)==="hore"?"dole":"hore")+'</div>'+
      '<div class="r">Má dosť: <q>'+m.c+'</q> <span class="znacka '+kt[0]+'">'+kt[1]+'</span></div></div></button>';
  }).join("");
  return '<div class="stol"><div class="pilulka"><b class="n">Draft starších</b>'+(t?'výber '+(st.picks.length+1)+'/8 · vyberá <b>'+(t==="A"?"Ty":"Súper (ťukni za neho)")+'</b>':'hotovo — 4 a 4')+'</div>'+
    '<div style="height:16px"></div><div class="had">'+had+'</div><div class="draft">'+tiles+'</div></div>'+
    '<div class="rad-tl"><button class="tl" id="dokonci">Dokonči ukážkou</button><button class="tl" id="odznova">Od znova</button></div>'+
    '<div class="panel"><h3>Čo tu vidíš</h3><ul><li>Na začiatku partie si hráči rozoberú 8 starších <b>hadovito A, B, B, A, A, B, B, A</b> — každý 4.</li>'+
    '<li>Každý starší má <b>pečeň</b> (životy) a <b>6 akcií</b> (3 vľavo, 3 vpravo, jedno miesto na každej strane je zablokované).</li>'+
    '<li>Tip pre draft: starší s akciami <b>vpravo hore</b> sa so staršími s akciami <b>vľavo hore</b> spojí na troch miestach; dvaja rovnakého druhu len na dvoch. Typ starších teda rozhoduje, koľko akcií rad dá.</li>'+
    '<li>Text Kšeftu väzňa zmizne — na karte staršieho je len efekt <b>Má dosť</b>, ktorý začne platiť, keď staršieho podrazí súper.</li></ul></div>';
}
const ikonaPecen=()=>'<span style="display:inline-block;width:14px;height:14px;vertical-align:-2px;fill:var(--cervena-svetla)">'+ikona("PoškodeniePečene")+'</span>';

// ---------- stôl ----------
function krokStol(){
  dokonciDraft();
  const L=pocitajLiniu(),rj=pocitajRad(st.ja,new Set()),rs=pocitajRad(st.su,new Set());
  return '<div class="tok"><span>Výber lokality</span><b>&#8594;</b><span>Šenok</span><b>&#8594;</b><span class="nove">Prerobenie radu</span><b>&#8594;</b><span>Zhromaždenie</span><b>&#8594;</b><span>Pitka ×1–4 (poldeci, NA EX)</span><b>&#8594;</b><span>Bitka</span></div>'+
    barHraca("su")+'<div class="stol"><div class="pilulka"><b class="n">Zhromaždenie</b>kolo 4 · Krčma (úroveň 2) · na ťahu si ty</div>'+
    '<div style="height:12px"></div>'+rad(st.su,"su",{odznaky:id=>st.jed[id]?'<span class="odz jed">'+ikona("Pohoršenie")+'jed '+st.jed[id]+'</span>':""})+'<div class="rad-oddelovac"></div>'+linia()+'<div class="rad-oddelovac"></div>'+rad(st.ja,"ja")+'</div>'+barHraca("ja")+
    '<div class="sucty">'+sucetTab(L.sum.ja,rj.sum,"ja")+sucetTab(L.sum.su,rs.sum,"su")+'</div>'+
    '<div class="panel"><h3>Čo tu vidíš</h3><ul><li><b>Línia pri lokalite</b> je presne ako v Kalamite — vykladá sa, páruje, NA EX, Pitky.</li>'+
    '<li><b>Rad starších</b> leží každému mimo línie. Susední starší sa spájajú ako karty v línii (pravá hrana ↔ ľavá hrana, rovnaký riadok); svietiace akcie sú aktívne.</li>'+
    '<li>Akcie radu sa <b>pripočítajú</b> k akciám z línie — tabuľka hore ukazuje Línia + Rad = Spolu.</li>'+
    '<li>Rad sa s líniou ani s lokalitou nespája a do prevahy v krajoch sa nepočíta.</li>'+
    '<li>Bar zdrojov ostáva (cigarety, poldeci, Dlhy, pečeň v Pitke, Cirhózy, Absťák); <b>špaky nie sú</b>, stupnica priazne a strachu ani väzni tiež nie.</li></ul></div>';
}

// ---------- prerobenie ----------
function najlepsiePoradie(ids){
  const perm=a=>a.length<=1?[a]:a.flatMap((x,i)=>perm([...a.slice(0,i),...a.slice(i+1)]).map(p=>[x,...p]));
  let best=null,bv=-1;for(const p of perm(ids)){const s=pocitajRad(p,new Set()).sum,v=tuhe(s)*10+(s.Povera||0);if(v>bv){bv=v;best=p}}return best;
}
function krokPrerob(){
  dokonciDraft();
  const pred=pocitajRad(st.povodne,new Set()).sum,teraz=pocitajRad(st.ja,new Set()).sum;
  const por=(n,a,b,lepsie)=>{const d=b-a;return '<tr><td>'+n+'</td><td>'+a+'</td><td class="spolu">'+b+'</td><td style="color:var(--'+(d===0?"slaby":((d>0)===lepsie?"zelena-svetla":"cervena-svetla"))+')">'+(d>0?"+":"")+d+'</td></tr>'};
  let t='<tr class="tuhe"><td>Tuhé</td><td>'+tuhe(pred)+'</td><td>'+tuhe(teraz)+'</td><td>'+((tuhe(teraz)-tuhe(pred))>0?"+":"")+(tuhe(teraz)-tuhe(pred))+'</td></tr>';
  for(const a of PORADIE_AKCII){if(!(pred[a]||teraz[a]))continue;t+=por(akCh(a),pred[a]||0,teraz[a]||0,!["Dlh","PoškodeniePečene"].includes(a))}
  const ovl=(id,i)=>'<div class="ovl"><button data-pos="'+i+'" data-smer="-1"'+(i===0?" disabled":"")+'>&#9664;</button><button data-pos="'+i+'" data-smer="1"'+(i===3?" disabled":"")+'>&#9654;</button></div>';
  return '<div class="stol"><div class="pilulka"><b class="n">Prerobenie radu</b>po braní zo šenku · obaja naraz a skryto (návrh)</div><div style="height:14px"></div>'+
    rad(st.ja,"ja",{ovl,bezPecene:false})+'</div>'+
    '<div class="rad-tl"><button class="tl" id="navrhni">Navrhni poradie (najviac tuhého)</button><button class="tl" id="povodne">Pôvodné poradie</button></div>'+
    '<div class="panel"><h3>Tvoj rad: pred prestavbou → teraz</h3><table class="sum"><tr><th>Akcia</th><th>Pred</th><th>Teraz</th><th>Rozdiel</th></tr>'+t+'</table>'+
    '<p class="maly tlmeny">Šípkami posúvaš staršieho v rade. Svietiace sloty ukazujú spoje, ktoré poradie vytvorí.</p></div>'+
    '<div class="panel"><h3>Čo tu vidíš</h3><ul><li>Po braní zo šenku si hráč smie rad 4 starších <b>ľubovoľne preusporiadať</b> podľa kariet, ktoré má v ruke (napr. viac Povier, keď súper nemá Vieru).</li>'+
    '<li>Rad ostáva 4-členný; podrazení starší v ňom ostávajú ako spojky (krok 5).</li>'+
    '<li>Otáčanie starších o 180° mock neukazuje — je v otvorených otázkach.</li></ul></div>';
}

// ---------- bitka ----------
function bitka(){
  dokonciDraft();
  const L=pocitajLiniu(),rj=pocitajRad(st.ja,new Set()).sum,rs=pocitajRad(st.su,new Set()).sum;
  const sp=(lin,r,a)=>(lin[a]||0)+(r[a]||0);
  const T={ja:tuhe(L.sum.ja)+tuhe(rj),su:tuhe(L.sum.su)+tuhe(rs)};
  const A={ja:{},su:{}};for(const a of ["Povera","Viera","Pohoršenie"]){A.ja[a]=sp(L.sum.ja,rj,a);A.su[a]=sp(L.sum.su,rs,a)}
  const plosneNaJa=Math.max(0,A.su.Povera-A.ja.Viera),plosneNaSu=Math.max(0,A.ja.Povera-A.su.Viera);
  const porazeny=T.ja===T.su?null:(T.ja<T.su?"ja":"su"),nakl=Math.abs(T.ja-T.su);
  // jed z minulého kola
  const jedTeraz={...st.jed};
  // kto ešte stojí po jede (tuhé sa rozdeľuje len medzi stojacich)
  const stojaci=kto=>st[kto].filter(id=>st.cur[id]-(jedTeraz[id]||0)-(kto==="ja"?plosneNaJa:plosneNaSu)>0);
  return {T,A,plosneNaJa,plosneNaSu,porazeny,nakl,jedTeraz,stojaci};
}
function padStarsieho(id,b){
  const kto=st.ja.includes(id)?"ja":"su";
  return (b.jedTeraz[id]||0)+(kto==="ja"?b.plosneNaJa:b.plosneNaSu)+(st.rozdel[id]||0);
}
function ukazkoveRozdelenie(b){
  st.rozdel={};if(!b.porazeny)return;let zv=b.nakl;const s=b.stojaci(b.porazeny).sort((x,y)=>(st.cur[y]-st.cur[x]));
  // porazený rozkladá na najzdravších
  let i=0;while(zv>0&&s.length){st.rozdel[s[i%s.length]]=(st.rozdel[s[i%s.length]]||0)+1;zv--;i++}
}
function krokBitka(){
  const b=bitka();
  const rozd=Object.values(st.rozdel).reduce((x,y)=>x+y,0),zvysok=b.nakl-rozd;
  if(!st.mojJed){st.mojJed=b.stojaci("su").sort((x,y)=>st.cur[x]-st.cur[y])[0]||st.su[0]}
  const jedSuNaMna=b.A.su.Pohoršenie,mojJedSila=b.A.ja.Pohoršenie;
  const cielSu=[...st.ja].sort((x,y)=>st.cur[x]-st.cur[y])[0];
  const odz=kto=>(id)=>{
    let h="";if(b.jedTeraz[id])h+='<span class="odz jed">'+ikona("Pohoršenie")+'jed −'+b.jedTeraz[id]+'</span>';
    const pl=kto==="ja"?b.plosneNaJa:b.plosneNaSu;if(pl)h+='<span class="odz dmg">'+ikona("Povera")+'−'+pl+'</span>';
    if(st.rozdel[id])h+='<span class="odz dmg">tuhé −'+st.rozdel[id]+'</span>';
    if(kto==="su"&&id===st.mojJed&&mojJedSila)h+='<span class="odz nova">nový jed '+mojJedSila+'</span>';
    if(kto==="ja"&&id===cielSu&&jedSuNaMna)h+='<span class="odz nova">nový jed '+jedSuNaMna+'</span>';
    return h};
  const pad={};[...st.ja,...st.su].forEach(id=>pad[id]=padStarsieho(id,b));
  const ovl=(kto)=>(id)=>{
    if(kto!==b.porazeny)return kto==="su"&&mojJedSila?'<div class="ovl"><button class="tl" style="width:auto;padding:0 6px;font-size:.66rem" data-jed="'+id+'"'+(id===st.mojJed?' disabled':'')+'>'+(id===st.mojJed?"jed tu":"sem jed")+'</button></div>':"";
    const can=b.stojaci(kto).includes(id);if(!can)return '<div class="ovl"><span class="maly tlmeny">padá</span></div>';
    return '<div class="ovl"><button data-r="'+id+'" data-d="-1"'+(!(st.rozdel[id])?" disabled":"")+'>−</button><span class="cislo">'+(st.rozdel[id]||0)+'</span><button data-r="'+id+'" data-d="1"'+(zvysok<=0?" disabled":"")+'>+</button></div>'};
  const meno=k=>k==="ja"?"Ty":"Súper";
  const vitaz=b.porazeny?(b.porazeny==="ja"?"su":"ja"):null;
  const kroky='<div class="kroky-bitky">'+
    '<div class="kb"><h4>'+ikona("Pohoršenie")+'1 · Jed z minulého kola</h4>'+(Object.keys(b.jedTeraz).length?Object.entries(b.jedTeraz).map(([id,n])=>CARDS[id].name+' stratí <span class="vys">'+n+'</span> pečene, potom jed klesne na '+Math.max(0,n-1)+'.').join(" "):"Žiadny.")+
      '<div class="os">'+[2,1,0].map((n,i)=>'<div><i style="height:'+(n*9+2)+'px"></i>kolo '+(4+i)+'<br>'+n+'</div>').join("")+'</div><div class="maly tlmeny">Pokles −1 za kolo — koeficient <span class="znacka z-todo">TODO</span></div></div>'+
    '<div class="kb"><h4>'+ikona("Povera")+'2 · Povery plošne, Viera štít</h4>'+
      'Súper: Povery '+b.A.su.Povera+' − tvoja Viera '+b.A.ja.Viera+' = <span class="vys">'+b.plosneNaJa+'</span> každému tvojmu staršiemu.<br>'+
      'Ty: Povery '+b.A.ja.Povera+' − súperova Viera '+b.A.su.Viera+' = <span class="vys">'+b.plosneNaSu+'</span> každému súperovmu.'+(b.A.su.Viera>=b.A.ja.Povera&&b.A.ja.Povera?' Jeho štít zastavil všetky tvoje Povery.':'')+'</div>'+
    '<div class="kb"><h4>'+ikona("Petelica")+'3 · Tuhé rozhodne bitku</h4>Ty <span class="vys">'+b.T.ja+'</span> : <span class="vys">'+b.T.su+'</span> súper → '+
      (vitaz?'<b>vyhráva '+meno(vitaz)+'</b>. Rozdiel <span class="vys">'+b.nakl+'</span> (Nakladačka) ide do pečene starších porazeného — rozdeľuje ho <b>porazený</b>, ako Nakladačku v Kalamite.':'remíza v tuhom, rozdiel nie je.')+'</div>'+
    '<div class="kb"><h4>'+ikona("Pohoršenie")+'4 · Nový jed (Pohoršenie)</h4>Tvoje Pohoršenia <span class="vys">'+mojJedSila+'</span>: jed na staršieho súpera podľa tvojho výberu'+(mojJedSila?' (teraz '+CARDS[st.mojJed].name+', ťukni „sem jed“ pre iného)':'')+'. Súperove <span class="vys">'+jedSuNaMna+'</span> → '+CARDS[cielSu].name+'. Účinok až v ďalšom kole.</div>'+
    '</div>';
  const roz=b.porazeny?'<div class="rozdel">'+(b.porazeny==="su"?'Súper prehral o <b>'+b.nakl+'</b> — rozdeľuje tuhé medzi svojich stojacich starších (v mocku ťukáš za neho).':'Prehral si o <b>'+b.nakl+'</b> — rozdeľ tuhé medzi svojich stojacich starších.')+
    ' Zostáva rozdeliť: <span class="ost">'+zvysok+'</span> <button class="tl" id="ukazRozdel" style="margin-left:6px;padding:3px 9px">Ukážkové rozdelenie</button></div>':'';
  const tab=kto=>'<table class="vysl"><tr><th>'+meno(kto)+'</th><th>pred</th><th>jed</th><th>plošné</th><th>tuhé</th><th>po</th></tr>'+st[kto].map(id=>{
    const j=b.jedTeraz[id]||0,p=kto==="ja"?b.plosneNaJa:b.plosneNaSu,t=st.rozdel[id]||0,po=st.cur[id]-j-p-t;
    return '<tr><td>'+CARDS[id].name+'</td><td>'+st.cur[id]+'</td><td>'+(j||"")+'</td><td>'+(p||"")+'</td><td>'+(t||"")+'</td><td class="'+(po<=0?"pad":"")+'">'+(po<=0?"Má dosť":po)+'</td></tr>'}).join("")+'</table>';
  return '<div class="pruh-todo"><b>NA DOLADENIE</b><span>Poškodenie pečene podľa Michalovho nápadu (2026-10-31): Povery plošne, tuhé rozdeľujú hráči medzi starších, Viera plošný štít, Pohoršenie jed na ďalšie kolo. Hodnoty a poradie krokov sú ilustrácia.</span></div>'+
    kroky+roz+'<div class="stol"><div class="pilulka"><b class="n">Bitka</b>kolo 4 · Krčma</div><div style="height:12px"></div>'+
    rad(st.su,"su",{pad,odznaky:odz("su"),ovl:ovl("su")})+'<div class="rad-oddelovac"></div>'+rad(st.ja,"ja",{pad,odznaky:odz("ja"),ovl:ovl("ja")})+'</div>'+
    '<div class="sucty"><div class="panel">'+tab("su")+'</div><div class="panel">'+tab("ja")+'</div></div>'+
    '<div class="panel"><h3>Čo tu vidíš</h3><ul><li>Bitka sa vyhodnotí ako v Kalamite (tuhé, pri remíze Absťáky, Dlhy), no namiesto špakov ide poškodenie do <b>pečene starších</b>.</li>'+
    '<li>Tri kanály: <b>Povery</b> zasiahnu všetkých súperových starších naraz, <b>tuhé</b> rozdelí porazený, <b>Pohoršenie</b> otrávi jedného staršieho podľa výberu toho, kto ho dal.</li>'+
    '<li>Blikajúce dieliky na ukazovateli pečene = čo bitka uberie. Starší na 0 je podrazený — <b>Má dosť</b>.</li></ul></div>';
}

// ---------- Má dosť ----------
function krokMaDost(){
  const b=bitka();if(b.porazeny&&Object.values(st.rozdel).reduce((x,y)=>x+y,0)<b.nakl)ukazkoveRozdelenie(b);
  const mrtvi=new Set([...st.ja,...st.su].filter(id=>st.cur[id]-padStarsieho(id,b)<=0));
  const prvy=[...st.su,...st.ja].find(id=>mrtvi.has(id));
  const kto=st.ja.includes(prvy)?"ja":"su",ids=st[kto];
  const pred=pocitajRad(ids,new Set()).sum,po=pocitajRad(ids,new Set([...mrtvi].filter(x=>ids.includes(x)))).sum;
  let t='<tr class="tuhe"><td>Tuhé</td><td>'+tuhe(pred)+'</td><td class="spolu">'+tuhe(po)+'</td></tr>';
  for(const a of PORADIE_AKCII){if(!(pred[a]||po[a]))continue;t+='<tr><td>'+akCh(a)+'</td><td>'+(pred[a]||0)+'</td><td class="spolu">'+(po[a]||0)+'</td></tr>'}
  const m=MADOST[prvy],kt=KTO[m.kto];
  const curPo={};[...st.ja,...st.su].forEach(id=>curPo[id]=st.cur[id]-padStarsieho(id,b));
  const zoznam=STARSI.map(id=>{const x=MADOST[id],k=KTO[x.kto];return '<div class="md"><img src="'+IMG[id]+'" alt=""><div><b>'+CARDS[id].name+'</b> <span class="znacka '+k[0]+'">'+k[1]+'</span><br><q>'+x.c+'</q><br>'+x.t+'</div></div>'}).join("");
  return '<div class="stol"><div class="pilulka"><b class="n">Má dosť</b>'+(kto==="su"?"podrazil si súperovho staršieho":"súper podrazil tvojho staršieho")+'</div><div style="height:12px"></div>'+
    rad(ids,kto,{mrtvi,cur:curPo,nazov:(kto==="ja"?"Tvoj rad":"Rad súpera")+" po bitke"})+'</div>'+
    '<div class="panel"><div class="madost-velka">'+karta(prvy,{mrtvy:true,stav:pocitajRad(ids,mrtvi).stav[prvy]})+
    '<div class="efekt-karta"><div class="h">Má dosť <span class="znacka '+kt[0]+'">'+kt[1]+'</span> <span class="znacka z-todo">návrh</span></div><h3>'+CARDS[prvy].name+'</h3><q>'+m.c+'</q><div>'+m.t+'</div>'+
    '<p class="maly" style="color:#5c5148;margin:8px 0 0">Platí od chvíle, keď staršieho podrazí súper. Akcie staršieho sú sivé — neplatia. Ostáva v rade a jeho susedia na spoji s ním svoje akcie <b>dostanú</b>.</p></div></div></div>'+
    '<div class="panel"><h3>Rad '+(kto==="ja"?"tvoj":"súpera")+': pred → po podrazení</h3><table class="sum"><tr><th>Akcia</th><th>Pred</th><th>Po</th></tr>'+t+'</table>'+
    '<p class="maly tlmeny">Susedova akcia na spoji s podrazeným ostáva svietiť; akcia podrazeného je sivá. Keď mal podrazený na spoji Posilnenie, susedovu akciu už nezdvojí (jeho akcia neplatí).</p></div>'+
    '<div class="panel"><h3>Efekty Má dosť všetkých 8 starších <span class="znacka z-todo">návrhy</span></h3><div class="zoznam-md">'+zoznam+'</div>'+
    '<p class="maly tlmeny">Štyri pomáhajú majiteľovi (súper si rozmyslí, koho podrazí prvého), tri mu škodia (podraziť ich sa oplatí skoro), Autobusár zasiahne oboch.</p></div>';
}

// ---------- lokality ----------
const SADY_LOK=[["zastavka","krcma","kostol"],["lesna_cesta","benzinka","kulturny_dom"]];
const UROVEN={zastavka:1,lesna_cesta:1,krcma:2,benzinka:2,kostol:3,kulturny_dom:3};
const NAST=["Kolo 1 · Zastávka","Kolo 2 · Benzínka","Kolo 3 · Kostol","Kolo 4 · Krčma"];
function krokLokality(){
  const sada=SADY_LOK[st.lokSada%2];
  const h=sada.map((id,i)=>{const u=UROVEN[id],k=CARDS[id];const akc=[...k.L,...k.R].filter(jeAkcia);
    const tod=id==="kulturny_dom"?'<br><span class="znacka z-todo">efekt so špakmi prepísať</span>':"";
    return '<button class="lok'+(i===st.lokVyber?" vybrana":"")+'" data-lok="'+i+'" style="border-style:solid">'+'<span class="uroven">Úroveň '+u+' '+'<i></i>'.repeat(u)+'</span>'+
      karta(id,{efekt:k.kL+" · "+k.kR})+'<span class="info">'+u+' '+(u===1?"akcia":"akcie")+' na hrane · '+akc.map(a=>NAZOV[a]).join(", ")+tod+'</span></button>'}).join("");
  return '<div class="stol"><div class="pilulka"><b class="n">Výber lokality</b>kolo '+st.kolo+' · vyberá obranca (víťaz poslednej bitky)</div><div style="height:16px"></div>'+
    '<div class="lokality">'+h+'</div><div class="nastenka">'+NAST.concat(Array.from({length:st.kolo-5},(_,i)=>"Kolo "+(5+i))).map(x=>'<span>'+x+'</span>').join("")+'</div></div>'+
    '<div class="rad-tl"><button class="tl hl" id="dalsieKolo">Odohraj kolo → ďalšia trojica</button></div>'+
    '<div class="panel"><h3>Čo tu vidíš</h3><ul><li>Vždy sú na výber <b>3 lokality, každá inej úrovne</b> (1, 2, 3). Obranca jednu vyberie a natočí ako dnes.</li>'+
    '<li>Lokality sa <b>neminú</b> — hrá sa, kým niekto nepodrazí všetkých súperových starších; dĺžka hry (liga 3/5/7) a finále v tomto režime nie sú.</li>'+
    '<li>Úroveň = počet akcií na hrane, teda aj počet Pitiek a sila kola: obranca volí, či chce krátke kolo na spodku, alebo veľké v sídlach šľachty.</li>'+
    '<li>Lokality s efektom na špaky (Kultúrny dom, Herňa) treba pre tento režim prepísať.</li></ul></div>';
}

// ---------- koniec ----------
function krokKoniec(){
  dokonciDraft();
  const mrtviSu=new Set(st.su),mrtviJa=new Set([st.ja[1],st.ja[2]]);
  const cur={};st.su.forEach(id=>cur[id]=0);st.ja.forEach((id,i)=>cur[id]=mrtviJa.has(id)?0:[4,0,0,2][i]);
  return '<div class="stol koniec"><div class="pilulka"><b class="n">Koniec partie</b>kolo 9 · Kostol</div><div style="height:12px"></div>'+
    rad(st.su,"su",{mrtvi:mrtviSu,cur,nazov:"Rad súpera — 4/4 podrazení"})+
    '<div class="vyhra"><h3>VYHRAL SI</h3><p>Posledný súperov starší — '+CARDS[st.su[st.su.length-1]].name+' — má dosť.</p><p class="maly">Tebe ostali stáť 2 zo 4 starších.</p></div>'+
    rad(st.ja,"ja",{mrtvi:mrtviJa,cur,nazov:"Tvoj rad — 2/4 stoja"})+'</div>'+
    '<div class="panel"><h3>Čo tu vidíš</h3><ul><li>Partia končí <b>hneď</b>, keď sú podrazení všetci 4 starší jedného hráča. Bez špakov, bez finále, bez výkupu.</li>'+
    '<li>Čo sa stane, keď padnú poslední starší oboch v tej istej bitke, je otvorená otázka.</li></ul></div>';
}

// ---------- texty ----------
function krokPochopili(){return '<div class="text panel"><h3>Čo sme pochopili</h3>'+
 '<p>„Päta, Lakeť, Otočka“ je druhý herný režim vedľa Kalamity: kolo (výber lokality, šenok, Zhromaždenie, Pitky s poldecami a NA EX, bitka) aj zdroje hráča (pečeň v Pitke, Dlhy, Absťák, cigarety, poldeci) ostávajú, no <b>špaky, stupnica priazne a strachu, väzni, ligy a finále zmiznú</b>.</p>'+
 '<p>Na začiatku si hráči hadovito (A, B, B, A, A, B, B, A) rozoberú 8 starších, každý štyroch. Starší dostane <b>pečeň</b> ako životy a jeho Kšeft väzňa nahradí efekt <b>Má dosť</b>.</p>'+
 '<p>Svojich 4 starších má hráč v <b>samostatnom rade</b> mimo línie. Susední starší sa spájajú ako karty v línii a aktívne akcie radu sa <b>pripočítajú</b> k akciám z línie; po braní zo šenku si hráč rad smie preusporiadať.</p>'+
 '<p>Bitka sa vyhráva ako dnes, ale poškodenie ide do <b>pečene súperových starších</b> (spôsob sa doladí: Povery plošne, tuhé rozdelené medzi starších, Viera plošný štít, Pohoršenie jed od ďalšieho kola, ktorý postupne slabne).</p>'+
 '<p>Starší s pečeňou na nule je <b>podrazený</b>: jeho akcie neplatia, ostáva v rade ako spojka (susedia svoje akcie na spoji s ním dostanú) a začne platiť jeho Má dosť — niektorý pomáha majiteľovi, iný mu škodí.</p>'+
 '<p>Lokality sa neminú: vždy sú na výber <b>tri, každá inej úrovne</b>, a hrá sa, kým niekto nepodrazí <b>všetkých štyroch</b> starších súpera.</p></div>';}
function krokOtazky(){
 const Q=[
  ["Pečeň starších","Rovnaká pre všetkých, alebo podľa postavy? Mock ukazuje 8–12.","Podľa sily akcií: starší s Petelicou či Posilnením menej pečene, slabší viac; začať okolo 10 ± 2 a doladiť turnajom botov."],
  ["Kto rozdeľuje tuhé a koľko ho je?","Celé tuhé oboch hráčov, alebo len rozdiel (Nakladačka) porazenému? Rozdeľuje porazený, alebo víťaz?","Len rozdiel, rozdeľuje porazený — ako Nakladačka v Kalamite. Rady starších dávajú obom stály základ, ktorý sa v rozdiele vyruší, a bitka ostane bitkou."],
  ["Viera ako štít","Tlmí len Povery (mock), alebo aj tuhé a jed?","Len Povery: plošné proti plošnému. Ak štít tlmí aj tuhé po rozdelení, rozkladanie po 1 bode je zadarmo a starší skoro nepadajú."],
  ["Jed z Pohoršenia","Koeficient poklesu (mock −1 za kolo) a kto vyberá cieľ.","−1 za kolo (3 → 2 → 1) a cieľ vyberá ten, kto Pohoršenie dal. Jedy na tom istom staršom sa sčítajú."],
  ["Kedy platia akcie radu","V každej Pitke aj v bitke ako akcie línie? Rad dáva stály Hazard a Poškodenie pečene v každej Pitke.","Áno, ako línia — inak by rad nemal ekonomickú váhu. Ak bude Pitka príliš drahá, rátať akcie radu len v poslednej Pitke a v bitke."],
  ["Otáčanie starších v rade","Smie hráč pri prestavbe staršieho otočiť o 180° ako kartu v línii?","V prvej verzii nie — stačí poradie (24 možností); otáčanie pridať, ak bude rad málo pestrý."],
  ["Prerobenie radu","Naraz a skryto, alebo striedavo s odhalením?","Naraz a skryto, odhalí sa pred Zhromaždením — ako stavba šenku."],
  ["Čo s pravidlami, ktoré pracujú so špakmi","Robota (špak za nespálený Dlh), Exekútor (berie špaky), Cirhóza na konci, Kultúrny dom, Herňa, výkup poldeci a cigariet.","Preložiť 1 špak = 1 pečeň: Exekútor uberie pečeň staršiemu dlžníka podľa jeho výberu, Robota za nespálený Dlh vylieči 1 pečeň. Lokality so špakmi prepísať."],
  ["Remíza na konci","Padnú poslední starší oboch v tej istej bitke.","Vyhrá víťaz tej bitky (vyššie tuhé); pri sekere remíza."],
  ["Kto začína","Kto draftuje prvý a kto je prvý obranca?","Prvý v drafte sa losuje; druhý je v 1. kole obranca a vyberá prvú lokalitu — vyváži výhodu prvého výberu."]
 ];
 return '<div class="text"><h3 style="margin:4px 4px 8px;color:var(--akcent-svetly)">Otvorené otázky (s odporúčaním)</h3>'+Q.map((q,i)=>'<div class="otazka"><h3><span>'+(i+1)+'.</span>'+q[0]+'</h3><div class="tlmeny maly">'+q[1]+'</div><div class="odp"><b>Odporúčanie:</b> '+q[2]+'</div></div>').join("")+'</div>';}

// ---------- krokovanie ----------
const KROKY=[
  ["Draft starších","1/9",krokDraft],["Herný stôl","2/9",krokStol],["Prerobenie radu","3/9",krokPrerob],["Bitka a poškodenie pečene","4/9",krokBitka],
  ["Podrazený starší — Má dosť","5/9",krokMaDost],["Výber lokality","6/9",krokLokality],["Koniec partie","7/9",krokKoniec],["Čo sme pochopili","8/9",krokPochopili],["Otvorené otázky","9/9",krokOtazky]
];
const main=document.getElementById("main"),bodky=document.getElementById("bodky");
function kresli(){
  const [nazov,cis,fn]=KROKY[st.krok];
  main.innerHTML='<section class="krok aktivny"><h2>'+nazov+'<small>'+cis+'</small></h2>'+fn()+'</section>';
  bodky.innerHTML=KROKY.map((k,i)=>'<button class="'+(i===st.krok?"akt":"")+'" data-k="'+i+'" title="'+k[0]+'">'+(i+1)+'</button>').join("");
  document.getElementById("spat").disabled=st.krok===0;
  document.getElementById("dalej").disabled=st.krok===KROKY.length-1;
}
function choď(k){st.krok=Math.max(0,Math.min(KROKY.length-1,k));history.replaceState(null,"","#"+(st.krok+1));kresli();window.scrollTo({top:0,behavior:"smooth"})}
document.getElementById("spat").onclick=()=>choď(st.krok-1);
document.getElementById("dalej").onclick=()=>choď(st.krok+1);
bodky.onclick=e=>{const b=e.target.closest("[data-k]");if(b)choď(+b.dataset.k)};
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")choď(st.krok+1);if(e.key==="ArrowLeft")choď(st.krok-1)});
main.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.pick&&naTahu()){st.picks.push(t.dataset.pick);if(st.picks.length===8){st.ja=[];dokonciDraft()}kresli();return}
  if(t.id==="dokonci"){st.ja=[];dokonciDraft();kresli();return}
  if(t.id==="odznova"){Object.assign(st,{picks:[],ja:[],su:[],povodne:[],cur:{},jed:{},rozdel:{},mojJed:null});kresli();return}
  if(t.dataset.pos!==undefined){const i=+t.dataset.pos,j=i+(+t.dataset.smer);[st.ja[i],st.ja[j]]=[st.ja[j],st.ja[i]];st.rozdel={};kresli();return}
  if(t.id==="navrhni"){st.ja=najlepsiePoradie(st.ja);st.rozdel={};kresli();return}
  if(t.id==="povodne"){st.ja=[...st.povodne];st.rozdel={};kresli();return}
  if(t.dataset.r){const b=bitka(),id=t.dataset.r,d=+t.dataset.d,roz=Object.values(st.rozdel).reduce((x,y)=>x+y,0);
    if(d>0&&roz>=b.nakl)return;st.rozdel[id]=Math.max(0,(st.rozdel[id]||0)+d);kresli();return}
  if(t.id==="ukazRozdel"){ukazkoveRozdelenie(bitka());kresli();return}
  if(t.dataset.jed){st.mojJed=t.dataset.jed;kresli();return}
  if(t.dataset.lok!==undefined){st.lokVyber=+t.dataset.lok;kresli();return}
  if(t.id==="dalsieKolo"){st.kolo++;st.lokSada++;st.lokVyber=Math.floor(Math.random()*3);kresli();return}
});
{const h=/^#([1-9])$/.exec(location.hash);if(h)st.krok=Math.min(KROKY.length-1,Math.max(0,+h[1]-1));}
kresli();
</script>
</body>
</html>
