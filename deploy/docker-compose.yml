# Produkčné nasadenie: aplikácia + Caddy (automatické HTTPS cez Let's Encrypt).
#   cd deploy && cp .env.example .env && (uprav .env) && docker compose up -d --build
# Toto je Vypálená (oficiálna hra). Pokusná Zrejúca beží vedľa ako projekt naex-zrejuca
# (docker-compose.zrejuca.yml) a pripája sa do siete tohto projektu „deploy_default“ —
# preto sa projekt (priečinok deploy) nepremenúva. Adresa je jedna; Caddy posiela do Zrejúcej
# podľa cookie naex_instancia a cesty /zrejuca/ (Caddyfile).

services:
  naex:
    build: ..
    restart: unless-stopped
    environment:
      NAEX_ADMIN_HESLO: ${NAEX_ADMIN_HESLO}
      NAEX_SECURE_COOKIE: "1"
      # Odkazy v e-mailoch (obnova hesla); odosielanie je zatiaľ len do logu (docs/NASADENIE.md 8).
      NAEX_ADRESA: https://${DOMENA}
      # Prepínač „Zrejúca“ na stránke Hrať (Michal 2026-11-02): "/" = tá istá adresa, smeruje Caddy.
      NAEX_ZREJUCA_ADRESA: "/"
      # Vypálená sa pýta Zrejúcej na verziu — bez zmien ju hráčom neponúkne.
      NAEX_ZREJUCA_URL: http://naex-zrejuca:8787
      NAEX_EMAIL_REZIM: ${NAEX_EMAIL_REZIM:-log}
    volumes:
      - naex-data:/data
    expose:
      - "8787"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMENA: ${DOMENA}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - naex

volumes:
  naex-data:
  caddy-data:
  caddy-config:
